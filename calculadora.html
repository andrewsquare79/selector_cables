<!DOCTYPE html>

<html lang="es">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1">

<title>Calculadora Ampacidad</title>

<link
href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
rel="stylesheet">

<link rel="stylesheet"
href="css/style.css">

<link rel="stylesheet"
href="css/ampacidad.css">

</head>

<body>

<div class="container py-5">

<h1>

Calculadora de Ampacidad

</h1>

<div class="card">

<div class="card-body">

<div class="row">

<div class="col-md-4">

<label>

Corriente (A)

</label>

<input

id="corriente"

class="form-control"

type="number">

</div>

<div class="col-md-4">

<label>

Material

</label>

<select

id="material"

class="form-select">

<option>

Cobre

</option>

<option>

Aluminio

</option>

</select>

</div>

<div class="col-md-4">

<label>

Instalación

</label>

<select

id="instalacion"

class="form-select">

<option>

Bandeja

</option>

<option>

Ducto

</option>

<option>

Enterrado

</option>

<option>

Aéreo

</option>

</select>

</div>

</div>

<br>

<div class="row">

<div class="col-md-4">

<label>

Temperatura

</label>

<input

id="temperatura"

value="30"

class="form-control"

type="number">

</div>

<div class="col-md-4">

<label>

Conductores cargados

</label>

<select

id="conductores"

class="form-select">

<option>

3

</option>

<option>

4

</option>

<option>

6

</option>

</select>

</div>

<div class="col-md-4">

<label>

Voltaje

</label>

<select

id="voltaje"

class="form-select">

<option>

0.6/1kV

</option>

<option>

15kV

</option>

<option>

25kV

</option>

</select>

</div>

</div>

<br>

<button

class="btn btn-primary"

onclick="calcularAmpacidad()">

Calcular

</button>

</div>

</div>

<br>

<div id="resultado">

</div>

</div>

<script src="js/ampacidad.js"></script>

</body>

</html>
